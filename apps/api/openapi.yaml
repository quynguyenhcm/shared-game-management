    delete:
      operationId: deleteTeamBanking
      summary: Remove the team's banking details
      description: TEAM_ADMIN of this team only. Takes the team row `FOR UPDATE`
        first, then refuses with 409 `banking_in_use` while the team has a
        PUBLISHED paid session or a PENDING or OVERDUE payment. Clears the name,
        number and last 4 together and any payout block, and notifies every
        approved admin. Removing when nothing is stored is a harmless 200.
      parameters:
        - schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
