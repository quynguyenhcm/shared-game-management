  /auth/providers:
    get:
      operationId: getAuthProviders
      summary: Which OAuth providers are enabled
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  google:
                    type: boolean
                  facebook:
                    type: boolean
                required:
                  - google
                  - facebook
                additionalProperties: false
