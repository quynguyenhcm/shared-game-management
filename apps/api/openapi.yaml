  /teams:
    post:
      operationId: createTeam
      summary: Create a team
      description: "The creator becomes an approved TEAM_ADMIN with the skill level
        they chose. The body is strict (no `inviteCode`, `role`, `createdBy`).
        `idempotencyKey` is a UUID v4 the form generates once per render: a
        replay of the same key by the same user answers 200 with the team that
        already exists instead of 201, and never creates a second team."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                description:
                  type: string
                  maxLength: 1000
                visibility:
                  type: string
                  enum:
                    - PUBLIC
                    - PRIVATE
                skillLevel:
                  type: string
                  enum:
                    - BEGINNER
                    - INTERMEDIATE
                    - ADVANCED
                idempotencyKey:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12})$
              required:
                - name
                - visibility
                - skillLevel
                - idempotencyKey
              additionalProperties: false
      security:
        - sessionToken: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  team:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                      name:
                        type: string
                      description:
                        type:
                          - string
                          - "null"
                      visibility:
                        type: string
                        enum:
                          - PUBLIC
                          - PRIVATE
                    required:
                      - id
                      - name
                      - description
                      - visibility
                    additionalProperties: false
                  membership:
                    type: object
                    properties:
                      status:
                        type: string
                        enum:
                          - PENDING
                          - APPROVED
                          - REJECTED
                          - BANNED
                      role:
                        type: string
                        enum:
                          - TEAM_ADMIN
                          - MEMBER
                      skillLevel:
                        type: string
                        enum:
                          - BEGINNER
                          - INTERMEDIATE
                          - ADVANCED
                    required:
                      - status
                      - role
                      - skillLevel
                    additionalProperties: false
                required:
                  - team
                  - membership
                additionalProperties: false
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  team:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                      name:
