openapi: 3.1.0
info:
  title: Shared Game Management API
  version: 0.1.0
components:
  securitySchemes:
    sessionToken:
      type: http
      scheme: bearer
  schemas: {}
paths:
  /health:
    get:
      operationId: getHealth
      summary: Service and database health
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                      - degraded
                  db:
                    type: string
                    enum:
                      - ok
                      - unreachable
                  version:
                    type: string
                required:
                  - status
                  - db
                  - version
                additionalProperties: false
        "503":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                      - degraded
                  db:
                    type: string
                    enum:
                      - ok
                      - unreachable
                  version:
                    type: string
                required:
                  - status
                  - db
                  - version
                additionalProperties: false
  /auth/register:
    post:
      operationId: registerWithPassword
      summary: Register with email and password
      description: "Creates the player account and signs it in. The body is strict: an
        unknown field such as `role` is a 422."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                  minLength: 1
                  maxLength: 255
                email:
                  type: string
                password:
                  type: string
                sex:
                  type: string
                  enum:
                    - MALE
                    - FEMALE
                    - OTHER
              required:
                - fullName
                - email
                - password
                - sex
              additionalProperties: false
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                      email:
                        type: string
                      fullName:
                        type: string
                      sex:
                        type: string
                        enum:
                          - MALE
                          - FEMALE
                          - OTHER
                      role:
                        type: string
                        enum:
                          - GLOBAL_ADMIN
                          - PLAYER
                    required:
                      - id
                      - email
                      - fullName
                      - sex
                      - role
                    additionalProperties: false
                  session:
                    type: object
                    properties:
                      token:
                        type: string
                      expiresAt:
                        type: string
                        format: date-time
                        pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                    required:
                      - token
                      - expiresAt
                    additionalProperties: false
                required:
                  - user
                  - session
                additionalProperties: false
        "409":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                          - validation_failed
                          - unauthenticated
                          - session_expired
                          - forbidden
                          - cross_origin_request
                          - not_found
                          - conflict
                          - internal_error
                          - service_unavailable
                          - email_taken
                          - invalid_credentials
                          - too_many_attempts
                          - too_many_requests
                          - invalid_or_expired_token
                          - provider_not_enabled
