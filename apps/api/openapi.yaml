                      - message
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
  /auth/logout:
    post:
      operationId: logout
      summary: Sign out
      description: Revokes the presented session. Answers 204 for an already dead or
        absent session too.
      security:
        - sessionToken: []
        - {}
      responses:
        "204":
          description: Signed out
  /auth/me:
    get:
      operationId: getMe
      summary: The signed-in user
      security:
        - sessionToken: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                      email:
                        type: string
                      fullName:
                        type: string
                      sex:
                        type: string
                        enum:
                          - MALE
                          - FEMALE
                          - OTHER
                      role:
                        type: string
                        enum:
                          - GLOBAL_ADMIN
                          - PLAYER
                    required:
                      - id
                      - email
                      - fullName
                      - sex
                      - role
                    additionalProperties: false
                required:
                  - user
                additionalProperties: false
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                          - validation_failed
                          - unauthenticated
                          - session_expired
                          - forbidden
                          - cross_origin_request
                          - not_found
                          - conflict
                          - internal_error
                          - service_unavailable
                          - email_taken
                          - invalid_credentials
                          - too_many_attempts
                          - too_many_requests
                          - invalid_or_expired_token
                          - provider_not_enabled
                          - provider_unavailable
                          - oauth_state_invalid
                          - oauth_cancelled
                          - oauth_email_missing
                          - oauth_email_unverified
                          - oauth_account_exists
                          - signup_expired
                          - identity_in_use
                          - provider_already_connected
                          - link_session_mismatch
                          - last_sign_in_method
                      message:
