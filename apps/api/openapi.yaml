    post:
      operationId: oauthComplete
      summary: Finish a first-time Google or Facebook sign-up
      description: Requires the sex choice (422 keeps the pending sign-up valid). In
        one transaction consumes the pending sign-up and creates the user and
        identity. 201 for a new account, 200 when the identity already existed
        (finished in another tab).
