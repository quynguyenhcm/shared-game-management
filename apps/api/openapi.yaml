  /teams/{teamId}/banking:
    get:
      operationId: getTeamBanking
      summary: Read the team's banking details (masked)
      description: TEAM_ADMIN of this team only. Returns the account name, the last 4
        digits of the account number, whether payouts are configured and whether
        a failed payout destination blocks publishing (`payoutBlocked`), and who
        last changed the details. The full account number is never returned.
        When the stored values cannot be decrypted the answer is still 200 with
        `accountName` null and `unreadable` true; saving the details again
        restores them.
      parameters:
        - schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: path
          name: teamId
          required: true
      security:
        - sessionToken: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  banking:
                    type: object
                    properties:
                      isPayoutConfigured:
                        type: boolean
                      payoutBlocked:
                        type: boolean
                      accountName:
                        type:
                          - string
                          - "null"
                      unreadable:
                        type: boolean
                      accountNumberLast4:
                        anyOf:
                          - type: string
                            pattern: ^[0-9]{4}$
                          - type: "null"
                      lastChanged:
                        anyOf:
                          - type: object
                            properties:
                              at:
                                type: string
                                format: date-time
                                pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                              by:
                                anyOf:
                                  - type: object
                                    properties:
                                      fullName:
                                        type: string
                                    required:
                                      - fullName
                                    additionalProperties: false
                                  - type: "null"
                            required:
                              - at
                              - by
                            additionalProperties: false
                          - type: "null"
                    required:
                      - isPayoutConfigured
                      - payoutBlocked
                      - accountName
                      - unreadable
                      - accountNumberLast4
                      - lastChanged
                    additionalProperties: false
                required:
