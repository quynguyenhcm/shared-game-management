  /auth/oauth/{provider}/callback:
    post:
      operationId: oauthCallback
      summary: Finish a Google or Facebook sign-in or connect
      description: "Consumes the state exactly once. Outcomes: `signed_in` (a
        session), `pending_signup` (first-time user; nothing is created until
        `/auth/oauth/complete`), `linked` and `already_linked` (connect flow,
        needs the same user's bearer token). An email that matches an existing
        account is never signed in or linked: 409 `oauth_account_exists`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
                - type: object
                  properties:
                    state:
                      type: string
                      minLength: 1
                      maxLength: 256
                    code:
                      type: string
                      minLength: 1
                      maxLength: 2048
                  required:
                    - state
                    - code
                  additionalProperties: false
                - type: object
                  properties:
                    state:
                      type: string
                      minLength: 1
                      maxLength: 256
                    error:
                      type: string
                      minLength: 1
                      maxLength: 256
                  required:
                    - state
                    - error
                  additionalProperties: false
      parameters:
        - schema:
            type: string
            enum:
              - google
              - facebook
          in: path
          name: provider
          required: true
      security:
        - sessionToken: []
        - {}
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      outcome:
                        type: string
                        enum:
                          - signed_in
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                          email:
                            type: string
                          fullName:
                            type: string
                          sex:
                            type: string
                            enum:
                              - MALE
                              - FEMALE
                              - OTHER
                          role:
                            type: string
                            enum:
                              - GLOBAL_ADMIN
                              - PLAYER
                        required:
                          - id
                          - email
                          - fullName
                          - sex
                          - role
                        additionalProperties: false
                      session:
                        type: object
                        properties:
                          token:
                            type: string
                          expiresAt:
                            type: string
                            format: date-time
                            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                        required:
                          - token
                          - expiresAt
                        additionalProperties: false
                      returnTo:
                        type: string
                    required:
                      - outcome
                      - user
                      - session
                      - returnTo
                    additionalProperties: false
                  - type: object
                    properties:
                      outcome:
                        type: string
                        enum:
                          - pending_signup
                      pendingToken:
                        type: string
                      returnTo:
                        type: string
                    required:
                      - outcome
                      - pendingToken
                      - returnTo
                    additionalProperties: false
                  - type: object
                    properties:
                      outcome:
                        type: string
                        enum:
                          - linked
                      returnTo:
                        type: string
                        enum:
                          - /account
                    required:
                      - outcome
                      - returnTo
                    additionalProperties: false
                  - type: object
                    properties:
                      outcome:
                        type: string
                        enum:
                          - already_linked
                      returnTo:
                        type: string
                        enum:
                          - /account
                    required:
                      - outcome
                      - returnTo
                    additionalProperties: false
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                          - validation_failed
                          - unauthenticated
                          - session_expired
