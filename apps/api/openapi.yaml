  /teams/{teamId}:
    get:
      operationId: getTeam
      summary: Team detail
      description: A PUBLIC team, or a PRIVATE team only for a caller with a
        non-banned membership row; otherwise 404 `not_found`, identical to a
        team that does not exist. `myStatus` and `myRole` are the caller's own
        row (BANNED included).
