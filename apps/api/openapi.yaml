  /auth/oauth/{provider}/authorize:
    post:
      operationId: oauthAuthorize
      summary: Start a Google or Facebook sign-in
      description: Stores a single-use state (10 minutes) and returns the provider URL
        and the raw state, which the web keeps in its `sgm_oauth` binding
        cookie. `rerequest` is honoured for Facebook only
        (`auth_type=rerequest`). 404 `provider_not_enabled` when the provider
        has no credentials.
