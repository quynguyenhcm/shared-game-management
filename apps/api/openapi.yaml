    put:
      operationId: putTeamBanking
      summary: Save the team's banking details
      description: TEAM_ADMIN of this team only. Saves the account name and account
        number as one block under the team-row lock, after re-checking that the
        caller is still an approved admin. A blank or omitted `accountNumber`
        keeps the saved number (422 on a first save). `changeKey` is a UUID v4
        the form generates once per render; a replay never sends a second
        notification. A save that changes nothing writes nothing, except that
        any save clears a payout block. Every approved admin of the team (the
        caller included) is emailed about a change; the email carries no account
        name or digits. 422 `fieldErrors` use the shared copy deck and never
        echo the input; the body is strict.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accountName:
                  type: string
                  minLength: 1
                  maxLength: 100
                accountNumber:
                  type: string
                changeKey:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12})$
              required:
                - accountName
                - changeKey
              additionalProperties: false
