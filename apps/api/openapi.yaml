                        description:
                          type:
                            - string
                            - "null"
                        memberCount:
                          type: integer
                          minimum: 0
                          maximum: 9007199254740991
                        myStatus:
                          anyOf:
                            - type: string
                              enum:
                                - PENDING
                                - APPROVED
                                - REJECTED
                            - type: "null"
                      required:
                        - id
                        - name
                        - description
                        - memberCount
                        - myStatus
                      additionalProperties: false
