                          - already_requested
                          - already_member
                          - banned_from_team
                          - team_admin_cannot_be_banned
                          - last_team_admin
                          - membership_state_conflict
                      message:
                        type: string
                      fieldErrors:
                        type: object
                        propertyNames:
                          type: string
                        additionalProperties:
                          type: array
