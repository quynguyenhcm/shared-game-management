  /teams/find:
    get:
      operationId: findTeams
      summary: Find a team
      description: PUBLIC teams only. `q` is a case-insensitive substring match on
        name or description (`%`, `_` and `\` are literal); results are ordered
        by (lower(name), id), 20 per page, with opaque keyset cursors in both
        directions. `myStatus` is the signed-in caller's own PENDING, APPROVED
        or REJECTED row, null otherwise (and for BANNED).
      parameters:
        - schema:
            type: string
          in: query
          name: q
          required: false
        - schema:
            type: string
            maxLength: 700
            pattern: ^[A-Za-z0-9_-]+$
          in: query
          name: after
          required: false
      security:
        - sessionToken: []
        - {}
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  teams:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
