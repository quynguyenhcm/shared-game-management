  /auth/providers:
    get:
      operationId: getAuthProviders
      summary: Which OAuth providers are enabled
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  google:
                    type: boolean
                  facebook:
                    type: boolean
                required:
                  - google
                  - facebook
                additionalProperties: false
  /auth/password/forgot:
    post:
      operationId: forgotPassword
      summary: Request a password reset link
      description: Always 202 with the same body, whether or not an account exists for
        the email, so it cannot be used to discover accounts. The email is sent
        by the worker, not inline. At most one new link per user per 60 seconds;
        more requests from one client address per hour than the configured limit
        (default 10) are a 429.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  minLength: 1
                  maxLength: 320
              required:
                - email
              additionalProperties: false
      responses:
        "202":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: boolean
                    enum:
                      - true
                required:
                  - accepted
                additionalProperties: false
        "422":
