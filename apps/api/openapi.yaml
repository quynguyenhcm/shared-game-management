  /teams/{teamId}/join-requests:
    post:
      operationId: requestToJoinTeam
      summary: Ask to join a team
      description: Creates a PENDING membership with the required self-assessed
        `skillLevel` (a REJECTED row returns to PENDING). A PRIVATE team is
        joined only with its current `inviteCode`; without it the answer is 404
        `not_found`, identical to an unknown team. A PUBLIC team with a stale
        `inviteCode` is 404 `invite_invalid`. 409 `already_requested` /
        `already_member`; 403 `banned_from_team`.
