        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                skillLevel:
                  type: string
                  enum:
                    - BEGINNER
                    - INTERMEDIATE
                    - ADVANCED
                inviteCode:
                  type: string
                  minLength: 1
                  maxLength: 200
