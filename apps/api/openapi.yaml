  /auth/password/reset:
    post:
      operationId: resetPassword
      summary: Set a new password with a reset link token
      description: "Single use. In one transaction: consumes the token, sets the
        PASSWORD identity, deletes every Google and Facebook identity of the
        user (reported in `removedProviders`), revokes all sessions, invalidates
        other reset tokens and records the inbox proof. An expired, used or
        unknown token is 400 and never hashes; a password that breaks the rules
        is 422 and leaves the token usable."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  minLength: 1
                  maxLength: 512
                password:
                  type: string
              required:
                - token
                - password
              additionalProperties: false
      responses:
        "200":
          description: Default Response
          content:
