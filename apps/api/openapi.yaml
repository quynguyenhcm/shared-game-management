  /teams/{teamId}/members:
    get:
      operationId: listTeamMembers
      summary: List team members for admins
      description: "One section per call (`status` is PENDING, APPROVED or BANNED), 50
        per page with an opaque keyset cursor for the same section. PENDING:
        oldest request first. APPROVED: admins first, then by name. BANNED:
        newest first, with the ban reason (admins only). Full name and
        self-assessed skill only; never an email. `adminCount` counts approved
        admins and drives the last-admin hint."
      parameters:
        - schema:
            type: string
            enum:
              - PENDING
              - APPROVED
              - BANNED
          in: query
          name: status
          required: true
        - schema:
            type: string
            maxLength: 700
            pattern: ^[A-Za-z0-9_-]+$
          in: query
          name: after
          required: false
        - schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: path
          name: teamId
          required: true
      security:
        - sessionToken: []
