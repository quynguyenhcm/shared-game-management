        "429":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                          - validation_failed
                          - unauthenticated
                          - session_expired
                          - forbidden
                          - cross_origin_request
                          - not_found
                          - conflict
                          - internal_error
                          - service_unavailable
                          - email_taken
                          - invalid_credentials
                          - too_many_attempts
                          - too_many_requests
                          - invalid_or_expired_token
                          - provider_not_enabled
                          - provider_unavailable
                          - oauth_state_invalid
                          - oauth_cancelled
                          - oauth_email_missing
                          - oauth_email_unverified
                          - oauth_account_exists
                          - signup_expired
                          - identity_in_use
                          - provider_already_connected
                          - link_session_mismatch
                          - last_sign_in_method
                      message:
                        type: string
                      fieldErrors:
                        type: object
                        propertyNames:
                          type: string
                        additionalProperties:
                          type: array
                          items:
                            type: string
                      email:
                        type: string
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
        "503":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                          - validation_failed
                          - unauthenticated
                          - session_expired
                          - forbidden
                          - cross_origin_request
                          - not_found
                          - conflict
                          - internal_error
                          - service_unavailable
                          - email_taken
                          - invalid_credentials
                          - too_many_attempts
                          - too_many_requests
                          - invalid_or_expired_token
                          - provider_not_enabled
                          - provider_unavailable
                          - oauth_state_invalid
                          - oauth_cancelled
                          - oauth_email_missing
                          - oauth_email_unverified
                          - oauth_account_exists
                          - signup_expired
                          - identity_in_use
                          - provider_already_connected
                          - link_session_mismatch
                          - last_sign_in_method
                      message:
