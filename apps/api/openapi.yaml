  /auth/logout:
    post:
      operationId: logout
      summary: Sign out
      description: Revokes the presented session. Answers 204 for an already dead or
        absent session too.
      security:
        - sessionToken: []
        - {}
      responses:
        "204":
          description: Signed out
  /auth/me:
    get:
      operationId: getMe
      summary: The signed-in user
      security:
        - sessionToken: []
      responses:
        "200":
