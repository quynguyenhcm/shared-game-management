  /teams/{teamId}:
    get:
      operationId: getTeam
      summary: Team detail
      description: A PUBLIC team, or a PRIVATE team only for a caller with a
        non-banned membership row; otherwise 404 `not_found`, identical to a
        team that does not exist. `myStatus` and `myRole` are the caller's own
        row (BANNED included).
      parameters:
        - schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: path
          name: teamId
          required: true
      security:
        - sessionToken: []
        - {}
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  team:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                      name:
                        type: string
                      description:
                        type:
                          - string
                          - "null"
                      visibility:
                        type: string
                        enum:
