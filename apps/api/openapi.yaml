  /auth/login:
    post:
      operationId: loginWithPassword
      summary: Sign in with email and password
      description: Every failure (unknown email, wrong password, account without a
        password) is the same 401. After 5 failures per email or 20 per client
        address in 15 minutes the answer is 429 with Retry-After, even for the
        right password.
