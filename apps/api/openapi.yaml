        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  minLength: 1
                  maxLength: 320
                password:
                  type: string
                  minLength: 1
                  maxLength: 1024
              required:
                - email
                - password
              additionalProperties: false
