        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                returnTo:
                  type: string
                  maxLength: 512
                rerequest:
                  type: boolean
              additionalProperties: false
      parameters:
        - schema:
            type: string
            enum:
              - google
              - facebook
          in: path
          name: provider
          required: true
